[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sut-control-center"
version = "0.1.0"
description = "Foundation for SUT Control Center"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=21,<23",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sut-control-center = "sut_control_center.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
